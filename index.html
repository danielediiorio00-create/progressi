<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Progressi</title>
    <meta name="description" content="Diario personale di corsa, palestra e metriche corporee. I dati restano solo sul tuo dispositivo." />
    <meta name="theme-color" content="#EFE7DF" />
    <!-- Comportamento da app quando aggiunta alla schermata Home di iPhone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Progressi" />
    <link rel="icon" href="%BASE_URL%icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <!-- Applica il tema (chiaro/scuro) prima del primo render per evitare lo "sfarfallio" -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('progressi.theme');
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
